<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel de produtos</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#eef1ee;color:#1d2528}header{background:#17323a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;padding:20px;max-width:1100px;margin:auto}@media(max-width:760px){main{grid-template-columns:1fr}}
button,input,textarea{font:inherit}button{cursor:pointer}.b{background:#17323a;color:#fff;border:0;padding:10px 16px}.b:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b9975b}.b.x{background:#fff;color:#a02020;border:1px solid #a02020}
#q,input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:9px;border:1px solid #9aa5a0;background:#fff;margin:4px 0 12px}.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid #d3dad6;padding:6px;margin-bottom:6px}.it img,.sem{width:44px;height:44px;object-fit:cover;background:#dfe4e0;flex:none}.it span:nth-child(2){flex:1}.it em{font-style:normal;font-size:.8rem;color:#666}.it em.on{color:#17794a;font-weight:600}
#f{background:#fff;padding:20px}#f[hidden]{display:none}label{font-weight:600;font-size:.9rem}.fotos{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.fotos div{width:110px}.fotos img{width:110px;height:110px;object-fit:cover;display:block}.fotos button{width:50%;float:left;border:1px solid #ccc;background:#fff}#msg{padding:8px 0;min-height:1.5em}.err{color:#a02020}</style></head><body>
<header><b>Painel de produtos</b><a href="/" style="color:#fff">Ver site</a></header>
<section id="lg" hidden style="padding:20px;max-width:360px;margin:auto"><form onsubmit="login(event)"><label>Senha do painel<input id="pw" type="password" required autocomplete="current-password"></label><div id="lm" class="err" role="alert"></div><button class="b">Entrar</button></form></section>
<main><aside><button class="b" onclick="edit()" style="width:100%;margin-bottom:12px">Novo produto</button><input id="q" type="text" placeholder="Buscar produto" oninput="draw()" aria-label="Buscar produto"><div id="lista"></div><h3>Categorias</h3><div id="cats"></div><button class="b" onclick="newCat()" style="margin-top:8px">Nova categoria</button></aside>
<form id="f" hidden onsubmit="save(event)"><label>Nome<input id="n" type="text" required></label><label>Endereço no site (slug)<input id="s" type="text"></label><label>Categoria<select id="c"></select></label><label>Preço em R$ (deixe vazio para "Sob consulta")<input id="p" type="number" step="0.01" min="0"></label><label>Material<input id="fm" type="text" placeholder="Ex.: Corda náutica e fibra sintética"></label><label>Medidas<input id="fd" type="text" placeholder="Ex.: 80 x 70 x 90 cm"></label><label>Cores disponíveis<input id="fc" type="text"></label><label>Prazo<input id="fl" type="text" placeholder="Ex.: Sob encomenda, 15 dias"></label><label>Descrição<textarea id="d" rows="6"></textarea></label>
<label>Fotos (a primeira é a capa)</label><div class="fotos" id="fotos"></div><input id="up" type="file" accept="image/*" multiple onchange="add(this.files)"><p><label><input id="a" type="checkbox"> Publicado no site</label><br><label><input id="ft" type="checkbox"> Destaque (aparece primeiro)</label></p><div id="msg" role="status"></div><button class="b">Salvar produto</button> <button type="button" class="b x" id="del" onclick="rem()">Excluir</button></form></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),sl=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let L=[],C=[],cur,touched=0;const J={'content-type':'application/json'},opts=v=>'<option value="">Sem categoria</option>'+[...new Set([...C.map(c=>c.name),...(v?[v]:[])])].map(n=>`<option>${esc(n)}</option>`).join('');
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()};
const msg=(t,e)=>{$('#msg').textContent=t;$('#msg').className=e?'err':''};
async function load(){try{L=await api('/api/admin/products');C=await api('/api/admin/cats');draw();drawC()}catch(e){if(/senha/i.test(e.message)){$('#lg').hidden=0;$('main').style.display='none';$('#pw').focus()}else msg('Não foi possível carregar: '+e.message,1)}}
async function login(e){e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({senha:$('#pw').value})});$('#lg').hidden=1;$('main').style.display='';load()}catch(x){$('#lm').textContent=x.message}}
function draw(){const q=$('#q').value.toLowerCase();$('#lista').innerHTML=L.filter(p=>p.name.toLowerCase().includes(q)).map(p=>{const i=JSON.parse(p.images)[0];return `<button class="it" onclick="edit(${p.id})">${i?`<img src="/img/${i}" alt="">`:'<span class="sem"></span>'}<span>${esc(p.name)}</span><em class="${p.active?'on':''}">${p.active?'Publicado':'Rascunho'}</em></button>`}).join('')}
function edit(id){const p=L.find(x=>x.id==id)||{name:'',slug:'',category:'',price:null,description:'',images:'[]',active:0};cur={...p,imgs:JSON.parse(p.images)};touched=0;$('#f').hidden=0;$('#n').value=p.name;$('#s').value=p.slug;$('#c').innerHTML=opts(p.category);$('#c').value=p.category;$('#fm').value=p.material||'';$('#fd').value=p.dims||'';$('#fc').value=p.colors||'';$('#fl').value=p.lead||'';$('#ft').checked=!!p.featured;$('#p').value=p.price??'';$('#d').value=p.description;$('#a').checked=!!p.active;$('#del').hidden=!p.id;msg('');fotos();$('#n').focus()}
$('#n').oninput=()=>{if(!touched&&!(cur.id&&cur.active))$('#s').value=sl($('#n').value)};$('#s').oninput=()=>touched=1;
function fotos(){$('#fotos').innerHTML=cur.imgs.map((k,i)=>`<div><img src="/img/${k}" alt="Foto ${i+1}"><button type="button" onclick="mv(${i})" aria-label="Mover para o início">←</button><button type="button" onclick="cur.imgs.splice(${i},1);fotos()" aria-label="Remover foto">×</button></div>`).join('')}
function mv(i){if(i>0){cur.imgs.splice(i-1,0,cur.imgs.splice(i,1)[0]);fotos()}}
async function red(f){const b=await createImageBitmap(f),s=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/webp',.8))}
async function add(fs){try{for(const f of fs){msg('Enviando '+f.name+'…');const fd=new FormData();fd.append('file',await red(f),'f.webp');cur.imgs.push((await api('/api/admin/upload',{method:'POST',body:fd})).key);fotos()}msg('Fotos enviadas. Clique em "Salvar produto" para publicar.')}catch(e){msg('Erro ao enviar foto: '+e.message,1)}$('#up').value=''}
async function save(e){e.preventDefault();const b={name:$('#n').value,slug:$('#s').value,category:$('#c').value,price:$('#p').value,description:$('#d').value,images:cur.imgs,active:$('#a').checked,material:$('#fm').value,dims:$('#fd').value,colors:$('#fc').value,lead:$('#fl').value,featured:$('#ft').checked};
 try{await api('/api/admin/products'+(cur.id?'/'+cur.id:''),{method:cur.id?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});await load();$('#f').hidden=1;alert('Produto salvo.')}catch(e){msg(e.message,1)}}
async function rem(){if(!confirm('Excluir este produto e as fotos dele?'))return;await api('/api/admin/products/'+cur.id,{method:'DELETE'});$('#f').hidden=1;load()}
function drawC(){$('#cats').innerHTML=C.map(c=>`<button class="it" onclick="editCat('${c.slug}')"><span>${esc(c.name)}</span></button>`).join('')}
async function newCat(){const name=prompt('Nome da categoria (ex.: Poltronas)');if(!name)return;const description=prompt('Texto curto que aparece na página da categoria (opcional)')||'';try{await api('/api/admin/cats',{method:'POST',headers:J,body:JSON.stringify({name,description})});load()}catch(e){alert(e.message)}}
async function editCat(s){const c=C.find(x=>x.slug==s),d=prompt('Texto da categoria "'+c.name+'". Para excluir a categoria, digite EXCLUIR.',c.description);if(d===null)return;try{if(d==='EXCLUIR')await api('/api/admin/cats/'+s,{method:'DELETE'});else await api('/api/admin/cats/'+s,{method:'PUT',headers:J,body:JSON.stringify({description:d})});load()}catch(e){alert(e.message)}}
load();
</script></body></html>
